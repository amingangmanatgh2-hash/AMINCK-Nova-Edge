# ═══════════════════════════════════════════════════════════════════
#  AMINCK Nova Bot — ربات فروش کانفیگ روی Cloudflare Workers
#
#  🚀 دیپلوی با یک کلیک (بدون ساخت دستی KV/D1):
#     https://deploy.workers.cloudflare.com/?url=https://github.com/amingangmanatgh2-hash/AMINCK-Nova-Edge
#
#  یا دستی:  npx wrangler deploy
# ═══════════════════════════════════════════════════════════════════
name = "aminck-nova-bot"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# هر ۱۵ دقیقه: کش نرخ ارز + سلامت سرورها + یادآوری + تبلیغ گروه‌ها + لیگ
[triggers]
crons = ["*/15 * * * *"]

# دیتابیس + کش داخل Durable Object (SQLite) — با دیپلوی خودکار ساخته می‌شود؛
# هیچ کلید KV/D1 لازم نیست.
[[durable_objects.bindings]]
name = "STORE"
class_name = "NovaStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NovaStore"]

# 🤖 هوش مصنوعی بومی کلادفلر (Workers AI) — چت، پشتیبانی و بررسی فیش
#    هیچ کلید خارجی لازم نیست؛ با دیپلوی خودکار فعال می‌شود.
[ai]
binding = "AI"

[vars]
# 🔑 توکن ربات — هنگام دیپلوی یک‌کلیکی از شما پرسیده می‌شود.
#    برای دیپلوی دستی:  npx wrangler secret put TELEGRAM_BOT_TOKEN
#    برای تست محلی: در فایل .dev.vars قرار دهید (کامیت نمی‌شود).
TELEGRAM_BOT_TOKEN = ""
# آدرس عمومی ورکر — بعد از اولین دیپلوی همین آدرس را اینجا بگذارید (اختیاری؛
# در غیر این صورت به‌صورت خودکار از اولین درخواست ذخیره می‌شود)
WORKER_URL = ""
