<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel 10 Pro Max — Interactive Simulator</title>
<style>
:root{
  --bg:#1A1C1E; --container:#2D2E30; --container2:#353638; --border:#4A4C4E;
  --text-hi:#E9EAEC; --text-med:#B9BCBE; --text-low:#7F8285;
  --pastel:#D3E4FF; --pastel-ink:#001C3B; --weather-badge:#004A77;
  --blue:#8AB4F8; --green:#81C995; --yellow:#FDD663; --red:#F28B82;
  --purple:#C58AF9; --teal:#78D0EC; --orange:#F8A96C;
  --accent:#8AB4F8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(circle at 50% 30%,#24272B,#101214 70%);
  color:var(--text-hi); display:flex; flex-direction:column; align-items:center;
  min-height:100vh; padding:18px 12px; overflow-x:hidden;
}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 80% 15%,rgba(138,180,248,.07),transparent 40%),
    radial-gradient(circle at 15% 85%,rgba(197,138,249,.07),transparent 40%);
}
/* view toggle */
.view-toggle{position:relative;z-index:5;display:flex;gap:4px;background:var(--container);
  border:1px solid var(--border);border-radius:50px;padding:4px;margin-bottom:16px;}
.view-toggle button{display:flex;align-items:center;gap:6px;border:0;background:transparent;
  color:var(--text-med);font-weight:600;font-size:13px;padding:8px 16px;border-radius:50px;cursor:pointer;}
.view-toggle button.active{background:var(--accent);color:#0B1522;}
/* phone */
.phone-wrap{position:relative;z-index:2;width:340px;height:708px;perspective:1600px;}
.phone{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1);}
.phone.back{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:54px;padding:7px;
  background:linear-gradient(160deg,#C9CDD1,#8E9398 30%,#B9BDC1 60%,#74797E);
  box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.15);
}
.face.back-face{transform:rotateY(180deg);}
.screen{width:100%;height:100%;border-radius:47px;background:var(--bg);overflow:hidden;position:relative;
  padding:4px;}
.screen-inner{width:100%;height:100%;border-radius:43px;overflow:hidden;position:relative;background:var(--bg);}
/* status bar */
.statusbar{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;
  align-items:center;padding:14px 22px 0;font-size:12px;font-weight:500;z-index:40;pointer-events:none;}
.statusbar .sb-right{display:flex;align-items:center;gap:7px;}
.statusbar svg{width:15px;height:15px;fill:var(--text-hi);}
/* camera island */
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:96px;height:24px;
  background:#050607;border:1px solid #202225;border-radius:50px;z-index:45;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;}
.island .lens{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8AB4F8,#1B3A5C 45%,#101418);}
.island .sensor{width:7px;height:7px;border-radius:50%;background:#2A2D31;}
/* generic scroll */
.scroll{overflow-y:auto;height:100%;scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}
.btn{cursor:pointer;border:0;font-family:inherit;}
/* lock screen */
.lock{position:absolute;inset:0;background:linear-gradient(180deg,#0E1626,#1A1C1E 55%,#111315);display:flex;
  flex-direction:column;align-items:center;z-index:30;}
.lock .l-time{font-size:74px;font-weight:100;margin-top:92px;letter-spacing:-2px;}
.lock .l-date{font-size:15px;color:var(--text-med);font-weight:500;}
.lock .l-notif{margin-top:34px;width:86%;background:rgba(45,46,48,.92);border:1px solid var(--border);
  border-radius:20px;padding:14px;display:flex;align-items:center;gap:10px;}
.l-notif .bubble{width:34px;height:34px;border-radius:50%;background:var(--purple);display:flex;
  align-items:center;justify-content:center;flex-shrink:0;}
.l-notif .bubble svg{width:18px;height:18px;fill:#fff;}
.l-notif h4{font-size:12px;}.l-notif p{font-size:11px;color:var(--text-med);}
.fp{margin-top:auto;margin-bottom:72px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.fp .ring{width:60px;height:60px;border-radius:50%;border:2px solid var(--blue);
  background:rgba(138,180,248,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;
  animation:pulse 1.6s ease-in-out infinite;}
.fp .ring svg{width:32px;height:32px;fill:var(--blue);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(138,180,248,.35);}50%{box-shadow:0 0 0 14px rgba(138,180,248,0);}}
.fp p{font-size:12px;color:var(--text-med);}
.fp .swipe{font-size:11px;color:var(--text-low);display:flex;align-items:center;cursor:pointer;}
/* home */
.home{position:absolute;inset:0;padding:56px 16px 70px;}
.at-glance{background:var(--pastel);border-radius:26px;padding:16px;display:flex;align-items:center;gap:10px;}
.at-glance .gl{flex:1;color:var(--pastel-ink);}
.at-glance .gl .tag{font-size:11px;font-weight:700;}
.at-glance .gl .day{font-size:15px;font-weight:600;margin:2px 0;}
.at-glance .gl .sub{font-size:11px;color:#33506E;}
.wbadge{background:var(--weather-badge);border-radius:16px;padding:8px 12px;color:#fff;display:flex;
  align-items:center;gap:5px;font-weight:700;font-size:15px;}
.wbadge svg{width:18px;height:18px;fill:#fff;}
.appgrid{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px 0;}
.appcell{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.appcell .name{font-size:10.5px;font-weight:500;color:var(--text-hi);}
.icon{width:54px;height:54px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;
  border:1px solid rgba(255,255,255,.12);transition:transform .12s;}
.appcell:active .icon{transform:scale(.9);}
.icon svg{width:26px;height:26px;fill:currentColor;}
.icon .glyph{width:26px;height:26px;}
.sq{border-radius:18px;} .circ{border-radius:50%;} .caps{border-radius:50px;} .diam{border-radius:14px;}
/* search */
.searchbar{margin-top:24px;background:var(--container);border:1px solid var(--border);border-radius:50px;
  padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.searchbar .g{color:var(--blue);font-weight:900;font-size:18px;}
.searchbar .ph{color:var(--text-low);font-size:13px;flex:1;}
.searchbar svg{width:17px;height:17px;fill:var(--text-med);}
/* dock */
.dock{position:absolute;bottom:44px;left:16px;right:16px;background:rgba(37,39,41,.96);border:1px solid var(--border);
  border-radius:30px;padding:12px 0;display:flex;justify-content:space-evenly;backdrop-filter:blur(8px);z-index:20;}
/* gesture bar */
.gesture{position:absolute;bottom:0;left:0;right:0;height:34px;z-index:42;display:flex;align-items:flex-end;
  justify-content:center;padding-bottom:8px;}
.gesture .pill{width:132px;height:5px;border-radius:50px;background:rgba(255,255,255,.85);}
.gesture .zones{position:absolute;inset:0;display:flex;}
.gesture .zones div{flex:1;cursor:pointer;}
/* app screen */
.appscreen{position:absolute;inset:0;background:var(--bg);z-index:35;display:flex;flex-direction:column;}
.apphandle{height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.apphandle .bar{width:36px;height:4px;border-radius:50px;background:var(--border);}
.appheader{display:flex;align-items:center;gap:10px;padding:4px 14px 8px;flex-shrink:0;}
.appheader .hic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;}
.appheader .hic svg{width:22px;height:22px;fill:currentColor;}
.appheader h2{font-size:19px;font-weight:700;flex:1;}
.appheader .home-btn{width:32px;height:32px;border-radius:50%;background:var(--container);display:flex;
  align-items:center;justify-content:center;cursor:pointer;}
.appheader .home-btn svg{width:16px;height:16px;fill:var(--text-med);}
.appbody{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:60px;}
.appbody::-webkit-scrollbar{display:none;}
.card{background:var(--container);border:1px solid var(--border);border-radius:16px;margin:0 14px 8px;padding:14px;}
.chip{background:var(--container2);border:1px solid var(--border);border-radius:50px;padding:8px 14px;
  font-size:12px;color:var(--text-med);cursor:pointer;white-space:nowrap;}
.chip.on{background:var(--blue);color:#0B1522;border-color:var(--blue);font-weight:600;}
.row{display:flex;align-items:center;}
.label-sm{font-size:10px;font-weight:700;color:var(--text-low);letter-spacing:.5px;padding:8px 18px 4px;}
/* shade */
.shade{position:absolute;inset:0;background:rgba(16,18,20,.72);z-index:60;}
.shade-panel{background:var(--container);border-radius:0 0 30px 30px;padding:18px;}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.qs{display:flex;align-items:center;gap:8px;background:var(--container2);border:1px solid var(--border);
  border-radius:20px;padding:12px;cursor:pointer;font-size:12px;color:var(--text-med);font-weight:500;}
.qs svg{width:18px;height:18px;fill:var(--text-med);}
.qs.on{background:rgba(138,180,248,.22);border-color:rgba(138,180,248,.6);color:var(--text-hi);}
.qs.on svg{fill:var(--blue);}
.slider-row{display:flex;align-items:center;gap:8px;background:var(--container2);border-radius:50px;padding:6px 14px;}
.slider-row svg{width:18px;height:18px;fill:var(--text-med);}
input[type=range]{-webkit-appearance:none;flex:1;height:4px;border-radius:50px;background:var(--border);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--blue);cursor:pointer;}
.notif{display:flex;gap:10px;align-items:center;background:var(--container2);border-radius:16px;padding:12px;margin-bottom:6px;}
.notif .ni{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.notif .ni svg{width:16px;height:16px;fill:currentColor;}
.notif h5{font-size:12px;}.notif p{font-size:11px;color:var(--text-med);}
/* recents */
.recents{position:absolute;inset:0;background:rgba(13,14,16,.94);z-index:58;padding:60px 16px;overflow-y:auto;}
.recents h3{text-align:center;font-size:13px;color:var(--text-med);margin-bottom:16px;}
.rcard{display:flex;align-items:center;gap:14px;background:var(--container);border:1px solid var(--border);
  border-radius:24px;padding:14px;margin-bottom:10px;cursor:pointer;}
.rcard .t{flex:1;font-size:15px;font-weight:600;}
.rcard .x{color:var(--text-low);cursor:pointer;padding:6px;}
.rcard .x svg{width:18px;height:18px;fill:var(--text-low);}
/* back face */
.back-inspector{width:100%;height:100%;border-radius:43px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#17191C,#222428 50%,#141619);padding:20px;color:var(--text-hi);}
.visor{background:linear-gradient(90deg,#3A3E43,#232629,#44484D);border:1px solid #55595E;border-radius:34px;
  height:150px;display:flex;align-items:center;justify-content:space-evenly;position:relative;}
.lens3{display:flex;flex-direction:column;align-items:center;gap:5px;}
.lens3 .ring{width:72px;height:72px;border-radius:50%;background:#0D0F11;border:2px solid #6A6F75;
  display:flex;align-items:center;justify-content:center;}
.lens3 .ring .core{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8AB4F8,#274C77 45%,#1A2230);}
.lens3 .mp{font-size:10px;font-weight:700;}.lens3 .sub{font-size:8px;color:var(--text-low);}
.flash{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;background:#FDD663;}
.speccard{background:var(--container);border:1px solid rgba(74,76,78,.5);border-radius:14px;padding:10px 14px;margin-top:8px;}
.speccard .k{font-size:9px;font-weight:700;color:var(--text-low);}
.speccard .v{font-size:12px;font-weight:500;margin-top:2px;}
.brand{display:flex;align-items:center;gap:8px;margin-top:auto;}
.brand .G{font-size:30px;font-weight:900;color:#fff;}
.brand h4{font-size:15px;}.brand p{font-size:11px;color:var(--text-low);}
.back-inspector .col{display:flex;flex-direction:column;height:100%;}
/* toggle switch */
.switch{width:44px;height:24px;border-radius:50px;background:var(--container2);position:relative;cursor:pointer;flex-shrink:0;transition:.2s;border:1px solid var(--border);}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-low);transition:.2s;}
.switch.on{background:var(--teal);}
.switch.on .knob{left:22px;background:#0B1522;}
/* setting rows */
.setrow{display:flex;align-items:center;gap:12px;background:var(--container);border-radius:16px;padding:14px;margin:0 14px 8px;}
.setrow .si{width:36px;height:36px;border-radius:10px;background:var(--container2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.setrow .si svg{width:19px;height:19px;fill:var(--blue);}
.setrow .st{flex:1;}.setrow .st h5{font-size:14px;font-weight:500;}.setrow .st p{font-size:11px;color:var(--text-low);}
.color-dots{display:flex;gap:12px;padding:8px 16px;}
.color-dots .cd{width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.color-dots .cd.sel{border:3px solid #fff;}
.color-dots .cd svg{width:18px;height:18px;fill:#0B1522;}
/* camera */
.cam{position:absolute;inset:0;background:#000;z-index:35;display:flex;flex-direction:column;}
.cam .vf{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#13203A,#0A0E16 60%,#1A1226);}
.cam .grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.12)),linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.12));
  background-size:100% 1px,100% 1px,1px 100%,1px 100%;
  background-position:0 33.3%,0 66.6%,33.3% 0,66.6% 0;
  background-repeat:no-repeat;
}
.cam .modes{display:flex;justify-content:space-evenly;padding:14px 8px 4px;font-size:11px;color:rgba(255,255,255,.6);}
.cam .modes span{cursor:pointer;}.cam .modes span.on{color:var(--yellow);font-weight:700;}
.cam .controls{display:flex;align-items:center;justify-content:space-between;padding:18px 30px 26px;}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;padding:6px;cursor:pointer;background:transparent;}
.shutter .in{width:100%;height:100%;border-radius:50%;background:#fff;}
.cam .ctrl{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.cam .ctrl.sq{border-radius:12px;}
.cam .ctrl svg{width:20px;height:20px;fill:#fff;}
.zoom-pills{display:flex;justify-content:center;gap:6px;margin-top:8px;}
.zoom-pills .zp{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;}
.zoom-pills .zp.on{background:var(--yellow);color:#000;}
.cam-top{display:flex;justify-content:space-between;padding:48px 16px 0;align-items:center;}
.cam-top .ct{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
.cam-top .ct svg{width:18px;height:18px;fill:#fff;}
.cam-top .mode-name{font-size:13px;font-weight:700;color:#fff;}
/* messages bubbles */
.bubble-chat{max-width:78%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.4;margin-bottom:6px;word-wrap:break-word;}
.bubble-chat.in{background:var(--container);color:var(--text-hi);border-bottom-left-radius:4px;}
.bubble-chat.out{background:var(--blue);color:#0B1522;border-bottom-right-radius:4px;margin-left:auto;}
.chat-row{display:flex;padding:0 14px;margin-bottom:3px;}
.chat-row.out{justify-content:flex-end;}
/* calculator */
.calc-display{background:var(--container);border-radius:18px;padding:18px;margin:0 18px 14px;text-align:right;}
.calc-display .expr{color:var(--text-med);font-size:18px;min-height:22px;}
.calc-display .res{color:var(--text-hi);font-size:42px;font-weight:100;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px;}
.calc-key{height:56px;border-radius:16px;background:var(--container);color:var(--text-hi);font-size:22px;
  font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;font-family:inherit;}
.calc-key.op{background:var(--blue);color:#0B1522;}
.calc-key.top{background:var(--container2);color:var(--red);}
/* music */
.album{margin:18px 24px;height:200px;border-radius:28px;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(from 0deg,var(--orange),var(--purple),var(--teal),var(--orange));}
.album svg{width:72px;height:72px;fill:rgba(255,255,255,.85);}
.music-ctrl{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:18px;}
.music-ctrl svg{width:34px;height:34px;fill:var(--text-hi);cursor:pointer;}
.play-btn{width:68px;height:68px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.play-btn svg{width:34px;height:34px;fill:#2A1500;}
/* phone dialer */
.dial-num{text-align:center;font-size:34px;font-weight:100;padding:16px;color:var(--text-hi);min-height:60px;}
.dial-grid{display:grid;grid-template-columns:repeat(3,66px);gap:10px;justify-content:center;}
.dial-key{width:66px;height:66px;border-radius:50%;background:var(--container);border:1px solid var(--border);
  color:var(--text-hi);font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.dial-actions{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;}
.call-btn{width:62px;height:62px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.call-btn svg{width:26px;height:26px;fill:#fff;}
.hang{width:66px;height:66px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.hang svg{width:28px;height:28px;fill:#fff;}
/* photos grid */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px;}
.photo{height:150px;border-radius:18px;cursor:pointer;position:relative;overflow:hidden;}
.photo .pt{position:absolute;bottom:6px;left:8px;font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);}
/* studio canvas */
.studio-canvas{margin:0 14px;height:260px;border-radius:24px;background:#101214;border:1px solid var(--border);
  position:relative;overflow:hidden;}
.studio-canvas canvas{width:100%;height:100%;display:block;}
.studio-tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);border-radius:50px;padding:5px 10px;font-size:10px;color:#fff;}
.studio-btns{display:flex;gap:10px;padding:14px;}
.studio-btn{flex:1;background:var(--container);border:1px solid var(--border);border-radius:16px;padding:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-hi);font-size:12px;font-weight:500;cursor:pointer;}
.studio-btn svg{width:16px;height:16px;fill:var(--blue);}
/* recorder */
.rec-card{margin:0 14px;background:var(--container);border:1px solid var(--border);border-radius:22px;padding:18px;}
.rec-time{font-size:40px;font-weight:100;}
.rec-sub{font-size:12px;color:var(--text-low);}
.rec-sub.live{color:var(--red);}
.rec-ctrl{display:flex;align-items:center;gap:10px;margin-top:14px;}
.rec-btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.rec-btn.main{background:var(--red);}.rec-btn.sec{background:var(--container2);}
.rec-btn svg{width:24px;height:24px;fill:#fff;}.rec-btn.sec svg{fill:var(--text-med);}
.wave{height:40px;margin:12px 0;display:flex;align-items:center;gap:2px;}
.wave span{flex:1;background:var(--red);border-radius:2px;}
/* gemini */
.gem-msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:13px;line-height:1.45;margin-bottom:8px;word-wrap:break-word;}
.gem-msg.ai{background:var(--container);color:var(--text-hi);}
.gem-msg.me{background:var(--purple);color:#fff;margin-left:auto;}
.suggest-row{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none;}
.suggest-row::-webkit-scrollbar{display:none;}
.gem-input{display:flex;align-items:center;gap:8px;padding:12px 14px;}
.gem-input .field{flex:1;background:var(--container);border:1px solid var(--border);border-radius:50px;padding:12px 16px;color:var(--text-hi);font-size:13px;outline:none;}
.gem-send{width:46px;height:46px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.gem-send svg{width:20px;height:20px;fill:#fff;}
/* notes */
.notes-area{margin:0 14px;background:var(--container);border:1px solid var(--border);border-radius:20px;padding:16px;
  width:calc(100% - 28px);height:280px;color:var(--text-hi);font-size:14px;line-height:1.6;outline:none;resize:none;font-family:inherit;}
/* weather */
.weather-hero{margin:0 14px;background:linear-gradient(180deg,#0B3C5D,#1E6FA8);border-radius:26px;padding:18px;
  display:flex;flex-direction:column;align-items:center;color:#fff;}
.weather-hero .city{font-size:14px;font-weight:500;}
.weather-hero .deg{font-size:64px;font-weight:100;}
.weather-hero svg{width:40px;height:40px;fill:#FFE082;}
.wmini-row{display:flex;gap:18px;margin-top:10px;}
.wmini{text-align:center;}.wmini b{font-size:13px;display:block;}.wmini span{font-size:9px;opacity:.7;}
.hourly{display:flex;justify-content:space-between;margin:0 14px;background:var(--container);border-radius:18px;padding:12px;}
.hour{text-align:center;}.hour svg{width:18px;height:18px;fill:var(--yellow);}.hour b{font-size:13px;display:block;}.hour span{font-size:11px;color:var(--text-med);}
.forecast-row{display:flex;align-items:center;gap:10px;background:var(--container);border-radius:14px;padding:12px;margin:0 14px 6px;}
.forecast-row .day{width:46px;font-size:13px;}
.forecast-row svg{width:20px;height:20px;fill:var(--teal);}
.forecast-row .tmp{margin-left:auto;font-size:13px;color:var(--text-med);}
.hint{color:var(--text-low);font-size:10px;padding:6px 18px;}
.flash{animation:flash .4s;}
@keyframes flash{0%{background:rgba(255,255,255,.9);}100%{background:transparent;}}
.battery-bar{height:8px;border-radius:50px;background:var(--container2);margin-top:10px;overflow:hidden;}
.battery-bar i{display:block;height:100%;background:var(--green);border-radius:50px;}
.foot{position:relative;z-index:2;margin-top:14px;color:var(--text-low);font-size:11px;text-align:center;}
.foot b{color:var(--text-med);}
</style>

let studioSeed=42, studioStyle='Geometric', studioErase=false;
function studioHTML(){
  const styles=['Geometric','Pastel','Neon','Mono'];
  return `<div class="studio-canvas"><canvas id="studio-cv" width="300" height="260"></canvas>
    <div class="studio-tag">AI Canvas · seed #${studioSeed} · ${studioStyle}</div></div>
  <div style="display:flex;gap:8px;padding:14px 14px 0">
    ${styles.map(s=>`<div class="chip ${s===studioStyle?'on':''}" onclick="studioSet('${s}')">${s}</div>`).join('')}
  </div>
  <div class="studio-btns">
    <div class="studio-btn" onclick="studioGen()">${I.wand}Generate</div>
    <div class="studio-btn" onclick="studioErase=!studioErase;studioDraw()">${I.erase}Magic Eraser</div>
    <div class="studio-btn" onclick="studioGen()">${I.save}Save</div>
  </div>
  <div class="hint">${studioErase?'Magic Eraser removed the highlighted object — on-device diffusion fills the gap.':'Tap Generate for new geometric art, or Magic Eraser to remove an object.'}</div>`;
}
function studioSet(s){studioStyle=s;studioErase=false;render();}
function studioGen(){studioSeed=Math.floor(Math.random()*9999)+1;studioErase=false;render();}
function drawStudio(){
  const cv=document.getElementById('studio-cv'); if(!cv)return; const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  let seed=studioSeed;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const pal = studioStyle==='Pastel'?['#D3E4FF','#FFD6E7','#D9F2D0','#FFE9C7']
    : studioStyle==='Neon'?['#00E5FF','#FF00C8','#B6FF00','#8A6BFF']
    : studioStyle==='Mono'?['#E9EAEC','#9A9D9F','#5A5D5F','#2D2E30']
    :['#8AB4F8','#C58AF9','#78D0EC','#FDD663'];
  for(let i=0;i<14;i++){
    ctx.fillStyle=pal[i%pal.length]; ctx.strokeStyle=pal[i%pal.length];
    const x=rnd()*W,y=rnd()*H,r=18+rnd()*60;
    ctx.globalAlpha=.85;
    if(i%4===0){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
    else if(i%4===1){ctx.globalAlpha=.15;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.globalAlpha=.8;ctx.lineWidth=6;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();}
    else if(i%4===2){ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();ctx.fill();}
    else {roundRect(ctx,x-r,y-r/3,r*2,r/1.6,40);ctx.fill();}
  }
  ctx.globalAlpha=1;
  if(studioErase){ctx.fillStyle='#101214';ctx.beginPath();ctx.arc(W*0.7,H*0.3,70,0,7);ctx.fill();}
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---- CALC ---- */
let calcExpr='', calcRes='0';
function calcPress(k){
  if(k==='C'){calcExpr='';calcRes='0';}
  else if(k==='⌫'){calcExpr=calcExpr.slice(0,-1);}
  else if(k==='='){calcRes=calcEval(calcExpr);}
  else { if(['+','−','×','÷'].includes(k)){ if('+-×÷*.'.includes(calcExpr.slice(-1)))calcExpr=calcExpr.slice(0,-1); calcExpr+= k==='×'?'*':k==='÷'?'/':k==='−'?'-':k; }
    else if(k==='.'){ if(!calcExpr.split(/[/+*\-]/).pop().includes('.'))calcExpr+='.'; }
    else calcExpr+=k;
    if(k!=='=')calcRes=calcEval(calcExpr); }
  render();
}
function calcEval(e){
  if(!e)return'0'; if('+-*/.'.includes(e.slice(-1)))e=e.slice(0,-1);
  try{ const r=Function('"use strict";return('+ (e.replace(/[^0-9+\-*/().]/g,'')||'0') +')')();
    if(r===Infinity||isNaN(r))return'Error';
    return Number.isInteger(r)?String(r):String(parseFloat(r.toFixed(6)));
  }catch(_){return'0';}
}
function calcHTML(){
  const rows=[['C','⌫','÷','×'],['7','8','9','−'],['4','5','6','+'],['1','2','3','='],['0','.','00','']];
  return `<div class="calc-display"><div class="expr">${calcExpr||' '}</div><div class="res">${calcRes}</div></div>
  <div class="calc-grid">${rows.flat().map(k=>{
    if(k==='')return '<div></div>';
    const op=['+','−','×','÷','='].includes(k), top=['C','⌫'].includes(k);
    return `<button class="calc-key ${op?'op':''} ${top?'top':''}" onclick="calcPress('${k}')">${k}</button>`;
  }).join('')}</div>`;
}
