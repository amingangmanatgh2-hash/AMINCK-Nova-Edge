name: Build DemGram APK

on:
  push:
    branches: [ "arena/01a07081-aminck-nova-edge", "main", "master" ]
    paths:
      - "demgram/**"
      - "public/demgram/**"
      - ".github/workflows/build-demgram-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build DemGram APK (debug)
        working-directory: demgram/android
        run: |
          chmod +x gradlew || echo "no gradlew"
          # Generate gradle wrapper if missing
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Build DemGram APK (release unsigned)
        working-directory: demgram/android
        run: |
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemGram-APK
          path: |
            demgram/android/app/build/outputs/apk/debug/*.apk
            demgram/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Copy APK to public for Cloudflare Pages
        run: |
          mkdir -p public/demgram
          cp demgram/android/app/build/outputs/apk/debug/app-debug.apk public/demgram/DemGram.apk || true
          cp demgram/android/app/build/outputs/apk/debug/app-debug.apk public/demgram/demgram.apk || true
          ls -lh public/demgram/*.apk || echo "no apk yet"

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: demgram/android/app/build/outputs/apk/debug/*.apk
